name: Plugin Registry

on:
  schedule:
    # Run every Monday at 00:00 UTC.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  crawl-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Crawl plugin registry
        env:
          GITHUB_TOKEN: ${{ secrets.PLUGIN_CRAWLER_GITHUB_TOKEN }}
        run: |
          uv run plugin-registry crawl-pyprojects \
            --output plugin-registry.json \
            --legacy-output plugin-crawler-upload.json \
            --skip-format
          uv run plugin-registry validate --input plugin-registry.json

      - name: Upload registry artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-registry
          path: plugin-registry.json

      - name: Upload legacy NOMAD archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-crawler-upload
          path: plugin-crawler-upload.json

  update-registry-pr:
    runs-on: ubuntu-latest
    needs: crawl-registry
    steps:
      - uses: actions/checkout@v4

      - name: Download registry artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-registry
          path: .

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Validate registry snapshot
        run: uv run plugin-registry validate --input plugin-registry.json

      - name: Create registry update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: automated/plugin-registry
          commit-message: Update plugin registry snapshot
          title: Update plugin registry snapshot
          body: |
            Updates `plugin-registry.json` from the scheduled plugin registry crawl.
          add-paths: plugin-registry.json

  upload-oasis:
    runs-on: ubuntu-latest
    needs: crawl-registry
    steps:
      - uses: actions/checkout@v4

      - name: Download legacy NOMAD archive artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-crawler-upload
          path: .

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: uv sync

      - name: Upload legacy plugin archives to NOMAD
        env:
          NOMAD_PASSWORD: ${{ secrets.PLUGIN_CRAWLER_NOMAD_PASSWORD }}
          NOMAD_USERNAME: ${{ vars.PLUGIN_CRAWLER_NOMAD_USERNAME }}
          NOMAD_URL: ${{ vars.PLUGIN_CRAWLER_NOMAD_URL }}
          UPLOAD_ID: ${{ vars.PLUGIN_CRAWLER_UPLOAD_ID }}
        run: uv run plugin-crawler --input plugin-crawler-upload.json
